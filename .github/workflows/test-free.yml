name: ✅ Test Bot (Free Tier)

on:
  push:
    branches: [ main, AI-Ver1 ]
    paths:
      - 'bot/**'
      - 'config.py'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-lint:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⚡ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8

      - name: 🔍 Quick lint check
        run: |
          black --check bot/ config.py --quiet || true
          flake8 bot/ --max-line-length=120 --quiet || true
        continue-on-error: true

      - name: 🧪 Run unit tests
        run: |
          pytest tests/ -v --tb=short --maxfail=5 -q
        continue-on-error: true

      - name: ✅ Verify imports
        run: |
          python -c "from bot.engine import TradingBot; print('✅ Engine loads')"
          python -c "from bot.local_ai_service import get_ai_service; print('✅ AI Service loads')"
          python -c "from config import settings; print('✅ Config loads')"
