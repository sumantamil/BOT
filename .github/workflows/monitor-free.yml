name: 🏥 Health Check (Free)

on:
  schedule:
    - cron: '0 9 * * 1-5'    # 9 AM IST
    - cron: '0 15 * * 1-5'   # 3 PM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: 🔔 Quick Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Verify bot config
        run: |
          pip install -r requirements.txt
          python -c "from config import settings; assert settings.trading.account_balance > 0; print('✅ Config valid')"

      - name: Test imports
        run: |
          python -c "from bot.engine import TradingBot; print('✅ Bot loads')"
          echo "✅ Health check passed"
